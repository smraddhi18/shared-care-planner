<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Shared Care Planner{% endblock %}</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#243124;background:#f6f8f3}*{box-sizing:border-box}body{margin:0}header{background:#254b3c;color:white;padding:1rem max(1rem,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:1rem}header a{color:white;text-decoration:none}main{max-width:1100px;margin:2rem auto;padding:0 1rem}h1,h2,h3{line-height:1.2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}.card{background:white;border:1px solid #dce5db;border-radius:14px;padding:1.25rem;box-shadow:0 5px 20px #1b4d2a0a;margin-bottom:1rem}label{display:block;font-weight:600;margin:.8rem 0 .35rem}input,select,textarea{width:100%;padding:.65rem;border:1px solid #aab9a9;border-radius:8px;font:inherit}input[type=checkbox]{width:auto}button,.button{background:#19684e;color:white;border:0;border-radius:8px;padding:.65rem 1rem;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.button.secondary{background:#e7eee8;color:#254b3c}button.danger{background:#9b3030}button:disabled{opacity:.5}small,.muted{color:#637268}.pill{font-size:.75rem;padding:.2rem .5rem;border-radius:99px;background:#e4efe6}.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}ul.clean{list-style:none;padding:0}li.item{border-top:1px solid #e6ece5;padding:.85rem 0}.notice{padding:.8rem;border-radius:8px;background:#e5f3e9;margin:1rem 0}.error{background:#fae6e6;color:#7b2222}nav{display:flex;align-items:center;gap:1rem}nav form{margin:0}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{margin:1rem auto}.row{align-items:stretch}}
</style></head><body><header><a href="/">◆ Shared Care Planner</a><nav>{% if user.is_authenticated %}<span>{{ user.email }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary">Sign out</button></form>{% else %}<a href="{% url 'login' %}">Sign in</a><a href="{% url 'signup' %}">Create account</a>{% endif %}</nav></header><main>{% for message in messages %}<div class="notice {% if message.tags == 'error' %}error{% endif %}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
